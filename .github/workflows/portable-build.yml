name: Build portable package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run tauri -- build --no-bundle
      - name: Build thin portable ZIP
        shell: pwsh
        run: ./tools/build_portable.ps1 -Version "${{ github.ref_name }}" -OutputRoot release
      - uses: actions/upload-artifact@v4
        with:
          name: UI-Studio-${{ github.ref_name }}-windows-x64
          path: |
            release/*.zip
            release/*.sha256
