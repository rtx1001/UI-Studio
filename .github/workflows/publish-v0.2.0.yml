name: Publish UI Studio 0.2.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.2.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build release executable
        run: npm run tauri -- build --no-bundle
      - name: Build portable package
        shell: pwsh
        run: ./tools/build_portable.ps1 -Version "0.2.0" -OutputRoot release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: UI Studio 0.2.0
          make_latest: true
          body: |
            UI Studio 0.2.0 adds a second processing path and restores automatic per-image working canvas selection.

            ## New in this release

            - Added a prominent **Local / Cloud API** switch in the top bar.
            - Added OpenAI image-edit processing using **GPT Image 2.5 Sunburst**.
            - OpenAI API keys remain in app memory only and are cleared when UI Studio closes.
            - Cloud mode requires no local AI runtime, model download, NVIDIA GPU, or CUDA installation.
            - DreamRoom LoRA is never loaded or sent when Cloud API mode is active.
            - Added **Auto** as the default Minimum size option. It selects the appropriate 256, 512, 768, 1024, or 2048 tier independently for each image.
            - Oversized source images are not downscaled by the local minimum-size workflow.
            - Cloud output restores original dimensions, mirrored paths, filenames, extensions, and exact PNG alpha masks.
            - Added per-image cloud batch progress and mode-specific readiness states.
            - Improved preparation of transparent and unusually shaped UI assets.

            ## Portable package

            Download `UI-Studio-0.2.0-windows-x64.zip`, extract it to a writable folder, and run `UI-Studio.exe`.

            Local mode can download its required resources from inside the app. Cloud API mode can be used without those downloads by supplying an OpenAI API key for the current session.
          files: |
            release/UI-Studio-0.2.0-windows-x64.zip
            release/UI-Studio-0.2.0-windows-x64.zip.sha256
